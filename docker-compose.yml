# The whole system, with one command:
#
#     docker compose up --build
#
# Then open the app on http://localhost:5173, and the traces its actions leave
# on http://localhost:16686 (Jaeger). The first build takes a few minutes.
#
# `docker compose down -v` also wipes the databases and the generated keys.
x-service: &service
  restart: unless-stopped
  # Our binaries write nothing to disk, and need no Linux capabilities.
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # Signing keys and mTLS certificates, generated by secrets-init: mounted
  # where the *_FILE and *_TLS_DIR settings below point.
  volumes: [pki:/run/secrets:ro]

# A service's migrations: its own image, with -migrate, once, before it starts.
x-migrate: &migrate
  command: ["-migrate"]
  depends_on:
    postgres: {condition: service_healthy}

# What every service gets: JSON logs, like production, and traces to Jaeger.
# APP_ENV stays development, to keep every trace: production keeps one in ten.
x-env: &env
  APP_ENV: development
  LOG_FORMAT: json
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

services:
  postgres:
    image: postgres:17-alpine
    container_name: payments-postgres
    # pg_stat_statements keeps statistics on every query: how often it ran,
    # and how long it took. It has to be loaded when Postgres starts.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: while its init scripts run, Postgres only listens on its
      # socket, so a check through the socket says ready too early.
      test: ["CMD-SHELL", "pg_isready -U payments -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: payments-redis
    ports:
      - "6379:6379"

  nats:
    image: nats:2.11-alpine
    container_name: payments-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    # Busybox's wget is in the image: healthy once JetStream is up.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email we send, in development. Its inbox: localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: payments-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # Traces: OTLP comes in on 4317 (gRPC) and 4318 (HTTP), and the UI is on
  # 16686. It keeps traces in memory, which is plenty for development.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: payments-jaeger
    ports:
      - "4317:4317"
      - "4318:4318"
      - "16686:16686"

  # Receives every service's traces, keeps errors and slow ones always (tail
  # sampling), and forwards to Jaeger. Set TRACE_SAMPLE_PERCENT below 100 to
  # sample the rest. The services never talk to Jaeger directly.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: payments-otel-collector
    command: ["--config=/etc/otelcol/collector.yml"]
    environment:
      TRACE_SAMPLE_PERCENT: ${TRACE_SAMPLE_PERCENT:-100}
    volumes:
      - ./deploy/otel/collector.yml:/etc/otelcol/collector.yml:ro
    depends_on:
      jaeger: {condition: service_started}

  # Metrics: it scrapes every service's /metrics. Its UI is on 9090.
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: payments-prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    # Our services run on the host, outside Docker. Docker Desktop knows
    # this name; on Linux, it needs this line.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Dashboards, on port 3000. Its data sources and dashboards come from
  # files, so nothing is ever clicked together by hand.
  grafana:
    image: grafana/grafana:13.2.6
    container_name: payments-grafana
    environment:
      # Development only: no login, and everyone is an admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  # Generates the token-signing key pair and the mTLS certificates, once, into
  # the pki volume. It replaces `make keys` and `make certs`.
  secrets-init:
    build: {context: ., args: {SERVICE: devinit, VERSION: "${VERSION:-dev}"}}
    image: payments/devinit
    user: "0:0"
    command: ["-dir", "/pki"]
    volumes: [pki:/pki]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    healthcheck: {disable: true}
    restart: "no"

  wallet:
    <<: *service
    build: {context: ., args: {SERVICE: wallet, VERSION: "${VERSION:-dev}"}}
    image: payments/wallet
    environment: &wallet-env
      <<: *env
      WALLET_DATABASE_URL: postgres://wallet_app:wallet_app@postgres:5432/wallet?sslmode=disable
      WALLET_REDIS_URL: redis://redis:6379/0
      WALLET_NATS_URL: nats://nats:4222
      WALLET_AUTH_PUBLIC_KEY_FILE: /run/secrets/auth_ed25519.pub.pem
      # Every fifteen seconds here, to watch it work. By default: daily, at 02:00 UTC.
      WALLET_RECONCILE_EVERY: 15s
      WALLET_TLS_DIR: /run/secrets/tls/wallet
    ports: ["8081:8081", "9081:9081", "9091:9091"] # gRPC and internal: mTLS
    depends_on:
      wallet-migrate: {condition: service_completed_successfully}
      secrets-init: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  wallet-migrate:
    <<: *migrate
    image: payments/wallet
    environment:
      <<: *wallet-env
      # The owner: the only role that can change the schema.
      WALLET_DATABASE_URL: postgres://wallet_owner:wallet_owner@postgres:5432/wallet?sslmode=disable

  auth:
    <<: *service
    build: {context: ., args: {SERVICE: auth, VERSION: "${VERSION:-dev}"}}
    image: payments/auth
    environment: &auth-env
      <<: *env
      AUTH_DATABASE_URL: postgres://auth_app:auth_app@postgres:5432/auth?sslmode=disable
      AUTH_PRIVATE_KEY_FILE: /run/secrets/auth_ed25519.pem
      AUTH_TLS_DIR: /run/secrets/tls/auth
    ports: ["8082:8082"]
    depends_on:
      auth-migrate: {condition: service_completed_successfully}
      secrets-init: {condition: service_completed_successfully}

  auth-migrate:
    <<: *migrate
    image: payments/auth
    environment:
      <<: *auth-env
      AUTH_DATABASE_URL: postgres://auth_owner:auth_owner@postgres:5432/auth?sslmode=disable

  transfer:
    <<: *service
    build: {context: ., args: {SERVICE: transfer, VERSION: "${VERSION:-dev}"}}
    image: payments/transfer
    environment: &transfer-env
      <<: *env
      TRANSFER_DATABASE_URL: postgres://transfer_app:transfer_app@postgres:5432/transfer?sslmode=disable
      TRANSFER_WALLET_ADDR: ${TRANSFER_WALLET_ADDR:-dns:///wallet:9081} # make chaos-up: through Toxiproxy
      TRANSFER_NATS_URL: nats://nats:4222
      TRANSFER_REDIS_URL: redis://redis:6379/0
      TRANSFER_AUTH_PUBLIC_KEY_FILE: /run/secrets/auth_ed25519.pub.pem
      TRANSFER_TLS_DIR: /run/secrets/tls/transfer
      TRANSFER_RISK_MAX_COUNT: ${TRANSFER_RISK_MAX_COUNT:-5} # load tests need more: make loadtest-up
    ports: ["8083:8083", "9083:9083"]
    depends_on:
      transfer-migrate: {condition: service_completed_successfully}
      secrets-init: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  transfer-migrate:
    <<: *migrate
    image: payments/transfer
    environment:
      <<: *transfer-env
      TRANSFER_DATABASE_URL: postgres://transfer_owner:transfer_owner@postgres:5432/transfer?sslmode=disable

  # It consumes the wallet's and the transfer service's streams, which they
  # create when they start: so it starts after them.
  notification:
    <<: *service
    build: {context: ., args: {SERVICE: notification, VERSION: "${VERSION:-dev}"}}
    image: payments/notification
    environment: &notification-env
      <<: *env
      NOTIFICATION_DATABASE_URL: postgres://notification_app:notification_app@postgres:5432/notification?sslmode=disable
      NOTIFICATION_NATS_URL: nats://nats:4222
      NOTIFICATION_AUTH_URL: https://auth:9082
      NOTIFICATION_SMTP_ADDR: mailpit:1025
      NOTIFICATION_TLS_DIR: /run/secrets/tls/notification
    ports: ["8084:8084"]
    depends_on:
      notification-migrate: {condition: service_completed_successfully}
      secrets-init: {condition: service_completed_successfully}
      wallet: {condition: service_healthy}
      transfer: {condition: service_healthy}

  notification-migrate:
    <<: *migrate
    image: payments/notification
    environment:
      <<: *notification-env
      NOTIFICATION_DATABASE_URL: postgres://notification_owner:notification_owner@postgres:5432/notification?sslmode=disable

  # The only one that faces the internet. 9080 is its metrics and probes port.
  gateway:
    <<: *service
    build: {context: ., args: {SERVICE: gateway, VERSION: "${VERSION:-dev}"}}
    image: payments/gateway
    environment:
      <<: *env
      GATEWAY_WALLET_ADDR: dns:///wallet:9081
      GATEWAY_AUTH_URL: http://auth:8082
      GATEWAY_TRANSFER_URL: ${GATEWAY_TRANSFER_URL:-http://transfer:8083} # make chaos-up: through Toxiproxy
      GATEWAY_WEBHOOK_URL: http://webhook:8085
      GATEWAY_WALLET_URL: http://wallet:8081
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_AUTH_PUBLIC_KEY_FILE: /run/secrets/auth_ed25519.pub.pem
      # The web app's proxy is the only client the gateway sees, so every
      # browser shares one address: a limit of 20 a minute would be shared by all.
      GATEWAY_IP_LIMIT: ${GATEWAY_IP_LIMIT:-300}
      # Login, register and refresh have a bucket of their own, per IP, and fail
      # closed. Also shared by every browser here: lower it outside the demo.
      GATEWAY_AUTH_LIMIT: ${GATEWAY_AUTH_LIMIT:-120}
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-http://localhost:5173}
      GATEWAY_TLS_DIR: /run/secrets/tls/gateway
    ports: ["8080:8080", "9080:9080", "9088:9088"] # 9088: internal, mTLS
    depends_on:
      secrets-init: {condition: service_completed_successfully}
      redis: {condition: service_started}
      otel-collector: {condition: service_started}

  # Webhooks. It consumes the transfer service's stream, so it starts after it.
  webhook:
    <<: *service
    build: {context: ., args: {SERVICE: webhook, VERSION: "${VERSION:-dev}"}}
    image: payments/webhook
    environment: &webhook-env
      <<: *env
      WEBHOOK_DATABASE_URL: postgres://webhook_app:webhook_app@postgres:5432/webhook?sslmode=disable
      WEBHOOK_NATS_URL: nats://nats:4222
      WEBHOOK_AUTH_PUBLIC_KEY_FILE: /run/secrets/auth_ed25519.pub.pem
      WEBHOOK_RETRY_SCHEDULE: ${WEBHOOK_RETRY_SCHEDULE:-} # empty: the real one
    ports: ["8085:8085"]
    # For receivers on this machine, outside Docker: Linux needs this line.
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      webhook-migrate: {condition: service_completed_successfully}
      secrets-init: {condition: service_completed_successfully}
      transfer: {condition: service_healthy}

  webhook-migrate:
    <<: *migrate
    image: payments/webhook
    environment:
      <<: *webhook-env
      WEBHOOK_DATABASE_URL: postgres://webhook_owner:webhook_owner@postgres:5432/webhook?sslmode=disable

  # The React app. nginx serves it, and proxies /api to the gateway and
  # /jaeger-api to Jaeger's query API, so the browser talks to one origin.
  web:
    build: {context: ./web}
    image: payments/web
    ports: ["5173:8080"]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      gateway: {condition: service_healthy}
      jaeger: {condition: service_started}

  # Network faults, on demand, for chaos experiments: a TCP proxy that we can
  # slow down or cut, through its API on port 8474. make chaos-up puts it in
  # front of the transfer service, and of the wallet's gRPC port.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: [chaos]
    command: ["-host=0.0.0.0", "-config=/etc/toxiproxy.json"]
    volumes:
      - ./deploy/chaos/toxiproxy.json:/etc/toxiproxy.json:ro
    ports:
      - "8474:8474"

volumes:
  pgdata:
  pki: # keys and certificates from secrets-init
