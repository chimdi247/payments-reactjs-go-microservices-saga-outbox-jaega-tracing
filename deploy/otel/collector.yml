# Services send OTLP here; the collector decides which whole traces to keep,
# then forwards them to Jaeger. Tail sampling waits for a trace to finish, so
# it can always keep the interesting ones: errors and slow requests.
receivers:
  otlp:
    protocols:
      http: {endpoint: 0.0.0.0:4318}
      grpc: {endpoint: 0.0.0.0:4317}

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    policies:
      - {name: errors, type: status_code, status_code: {status_codes: [ERROR]}}
      - {name: slow, type: latency, latency: {threshold_ms: 1000}}
      # Everything else: TRACE_SAMPLE_PERCENT (100 for the demo, 5-10 in production).
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:TRACE_SAMPLE_PERCENT}
  batch: {}

exporters:
  otlphttp/jaeger:
    endpoint: http://jaeger:4318
    tls: {insecure: true}
  # The collector's own health, for Prometheus.

extensions:
  health_check: {endpoint: 0.0.0.0:13133}

service:
  extensions: [health_check]
  telemetry:
    metrics: {address: 0.0.0.0:8888}
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlphttp/jaeger]
