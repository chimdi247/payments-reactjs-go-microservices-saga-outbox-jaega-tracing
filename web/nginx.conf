# One origin for the browser: the app itself, the API, and Jaeger's query API.
# Same-origin means no CORS to keep in step with where the app is served from.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The gateway never trusts a browser's trace headers (it starts its own
    # trace, and returns its ID in X-Trace-ID), so nothing special passes here.
    location /api/ {
        proxy_pass http://gateway:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 70s;
        client_max_body_size 64k;
    }

    # Jaeger's query API, read-only, so the app can draw a trace itself.
    location /jaeger-api/ {
        limit_except GET { deny all; }
        proxy_pass http://jaeger:16686/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # A webhook receiver that always says "got it": register
    # http://web:8080/sink in the app to watch deliveries succeed.
    location = /sink {
        access_log off;
        return 204;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
